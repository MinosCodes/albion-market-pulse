# Builds the Windows live client (AlbionMarketPulseClient.exe) for every published release
# and attaches it, together with its SHA-256 checksum, to the release.
#
# Default server: set the repository variable PULSE_SERVER_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://pulse.example.com. The .exe then opens with that server
# pre-filled. Only the address is built in; the ingest key is entered by each user (pairing link).
name: Windows client

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check requests rich pytest pyinstaller==6.11.1

      - name: Run tests
        run: python -m pytest -q

      - name: Bake default server address
        env:
          PULSE_SERVER_URL: ${{ vars.PULSE_SERVER_URL }}
        run: python client/windows/bake_defaults.py

      - name: Build exe
        run: pyinstaller --noconfirm --clean client/windows/pulse_client.spec

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist/AlbionMarketPulseClient.exe -ArgumentList '--version','--report','version.txt' -Wait -PassThru
          Get-Content version.txt
          if (-not (Select-String -Path version.txt -Pattern 'live client')) { exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/AlbionMarketPulseClient.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AlbionMarketPulseClient.exe" | Out-File -Encoding ascii dist/AlbionMarketPulseClient.exe.sha256
          Get-Content dist/AlbionMarketPulseClient.exe.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/AlbionMarketPulseClient.exe dist/AlbionMarketPulseClient.exe.sha256 --clobber

      - name: Keep build as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: AlbionMarketPulseClient
          path: dist/AlbionMarketPulseClient.exe*
